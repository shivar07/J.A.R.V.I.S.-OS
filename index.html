<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoboOS - Robotic Engineer Command Center</title>
  <meta name="description" content="A futuristic, glassmorphic sci-fi web operating system for robotics.">
  <link rel="stylesheet" href="style.css">
  <script>
    window.onerror = function(message, source, lineno, colno, error) {
      alert("RUNTIME ERROR:\n" + message + "\n\nSource: " + source + "\nLine: " + lineno + "\nCol: " + colno);
      return false;
    };
    window.addEventListener('unhandledrejection', function(event) {
      alert("UNHANDLED PROMISE REJECTION:\n" + event.reason);
    });
  </script>
</head>

<body>

  <div class="scanlines" id="scanlines-layer"></div>

  <div class="desktop-bg" id="desktop-bg"
    style="background-image: url('wallpaper/wp11991604-neon-4k-iron-man-wallpapers.jpg');"></div>

  <!-- Main desktop layout shell container -->
  <div id="desktop-area"
    style="display: none; opacity: 0; transition: opacity 0.8s ease; width: 100%; height: 100%; overflow: hidden; position: absolute; top: 0; left: 0; z-index: 5;">
  </div>

  <!-- Secure components and screen overlays container -->
  <div id="secure-injected-container"></div>

  <!-- Secure HTML Components Markup -->
  <script src="secure/desktop_base.js"></script>
  <script src="secure/start_menu.js"></script>
  <script src="secure/desktop_icons.js"></script>
  <script src="secure/flyouts.js"></script>
  <script src="secure/screens.js"></script>
  <script src="secure/win_jarvis.js"></script>
  <script src="secure/win_youtube.js"></script>
  <script src="secure/win_browser.js"></script>
  <script src="secure/win_tasks.js"></script>
  <script src="secure/win_terminal.js"></script>
  <script src="secure/win_settings.js"></script>
  <script src="secure/win_weather.js"></script>
  <script src="secure/win_music.js"></script>
  <script src="secure/win_showcase.js"></script>
  <script src="secure/win_gallery.js"></script>
  <script src="secure/win_socials.js"></script>
  <script src="secure/win_calculator.js"></script>
  <script src="secure/win_hackatime_stats.js"></script>
  <script src="secure/win_hackatime_leaderboard.js"></script>

  <script>
    // Synchronously inject HTML layout components
    (function() {
      const sc = window.secureComponents || {};
      
      const desktopArea = document.getElementById("desktop-area");
      if (desktopArea) {
        desktopArea.innerHTML = sc.desktopBase || "";
      }
      
      /*
      const iconsContainer = document.getElementById("desktop-icons-placeholder");
      if (iconsContainer) {
        iconsContainer.innerHTML = sc.desktopIcons || "";
      }
      */
      
      const startMenuPlaceholder = document.getElementById("start-menu-placeholder");
      if (startMenuPlaceholder) {
        startMenuPlaceholder.outerHTML = sc.startMenu || "";
      }
      
      const windowsContainer = document.getElementById("windows-container");
      if (windowsContainer) {
        windowsContainer.innerHTML = 
          (sc.win_jarvis || "") +
          (sc.win_youtube || "") +
          (sc.win_browser || "") +
          (sc.win_tasks || "") +
          (sc.win_terminal || "") +
          (sc.win_settings || "") +
          (sc.win_weather || "") +
          (sc.win_music || "") +
          (sc.win_showcase || "") +
          (sc.win_gallery || "") +
          (sc.win_socials || "") +
          (sc.win_calculator || "") +
          (sc.win_hackatime_stats || "") +
          (sc.win_hackatime_leaderboard || "");
      }
      
      const secureInjectedContainer = document.getElementById("secure-injected-container");
      if (secureInjectedContainer) {
        secureInjectedContainer.innerHTML = (sc.screens || "") + (sc.flyouts || "");
      }
    })();
  </script>

  <!-- Core Operating System Logic scripts -->
  <script src="jarvis.js"></script>
  <script src="js/core.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/youtube.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/music.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/showcase.js"></script>
  <script src="js/hud.js"></script>
  <script src="js/hackatime.js"></script>
  <script src="js/hackatime_leaderboard.js"></script>
  <script src="js/browser.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/calculator.js"></script>
  <script src="js/flyouts.js"></script>
  <script src="js/sign_in.js"></script>
  <script src="js/main.js"></script>
  <script src="terminal.js"></script>
  <script src="taskmanager.js"></script>
</body>

</html>
